# E102：1D 纯数据 FNO（w_data=1，其余 0）——档案 R005 datafno_train 线重写
# 物理参数：散热线 a=0.4 m²/s，Dirichlet 零边界（见 problems.cartesian.heat_line_cooling）
experiment: E102
seed: 0
physics:
  a: 0.4
  length: 1.0
  u_scale: 1.0
data:
  nx: 64
  nt: 64
  t_max: 0.5        # s
  n_samples: 400
  seed: 123
  ic: sine_or_square
  split_ratio: 0.8
  split_seed: 456
model:
  n_modes: [16, 16]
  hidden_channels: 64
  use_ansatz: true
training:
  derivative_method: finite_difference
  epochs: 3000
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-5
  checkpoint_every: 500
  device: auto
weights:
  data: 1.0
  pde: 0.0
  ic: 0.0
  bc: 0.0
