# E103：1D 纯物理 PINO（w_data=0, w_pde=10, w_ic=200, w_bc=100）——档案 datapino_train 线重写
experiment: E103
seed: 0
physics:
  a: 0.4
  length: 1.0
  u_scale: 1.0
data:
  nx: 64
  nt: 64
  t_max: 0.5        # s
  n_samples: 400
  seed: 123
  ic: sine_or_square
  split_ratio: 0.8
  split_seed: 456
model:
  n_modes: [16, 16]
  hidden_channels: 64
  use_ansatz: true
training:
  derivative_method: finite_difference
  epochs: 3000
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-5
  checkpoint_every: 500
  device: auto
weights:
  data: 0.0
  pde: 10.0
  ic: 200.0
  bc: 100.0
