[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "ring-rib-pinn"
version = "0.1.0"
description = "Reusable legacy-compatible 2.5D ring and spiral rib thermal PINNs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["deepxde==1.15.0", "numpy==2.5.3", "pandas==3.0.6", "scipy==1.18.1", "matplotlib==3.11.2"]

[project.optional-dependencies]
cpu = ["torch==2.12.1"]
cuda = ["torch==2.12.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
ring-rib-pinn = "ring_rib_pinn.cli:main"

[tool.uv]
cache-dir = ".cache/uv"
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", extra = "cpu"}, {index = "pytorch-cuda", extra = "cuda"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", "artifacts", "data", "local_reference_versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
