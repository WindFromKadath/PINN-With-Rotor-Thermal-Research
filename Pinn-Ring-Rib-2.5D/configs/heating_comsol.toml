# Alternate raw COMSOL import; writes separate data and preserves legacy evaluation points.
case = "heating"

[data]
upper_raw = "../data/raw/comsol/UnprocessData/T_d3.csv"
lower_raw = "../data/raw/comsol/UnprocessData/T_d1.csv"
rib_raw = "../data/raw/comsol/UnprocessData/T_d2.csv"
upper_csv = "../data/processed/comsol_heating/upper_domain.csv"
lower_csv = "../data/processed/comsol_heating/lower_domain.csv"
rib_csv = "../data/processed/comsol_heating/rib_domain.csv"
rib_json = "../data/processed/rib_models.json"
upper_thickness_csv = "../data/raw/thickness/upper.csv"
lower_thickness_csv = "../data/raw/thickness/lower.csv"
upper_thickness = "../local_reference_versions/heating_coupled/weights/upper_thickness.pth"
lower_thickness = "../local_reference_versions/heating_coupled/weights/lower_thickness.pth"

[data.preprocess.common]
length_unit = "mm"
thickness_unit = "mm"
temperature_unit = "K"
representation = "integral"
sparsify = true
eps = 0.005

[data.preprocess.upper]
thickness_csv = "../data/raw/comsol/UnprocessData/thickness_d3.csv"

[data.preprocess.lower]
thickness_csv = "../data/raw/comsol/UnprocessData/thickness_d1.csv"

[data.preprocess.rib]
thickness_csv = "../data/raw/comsol/UnprocessData/thickness_d2.csv"
sparsify = false

[output]
root = "../artifacts"
